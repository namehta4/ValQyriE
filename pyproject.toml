[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valqyrie"
version = "0.1.0"
description = "CPU-only, exact-statevector VQE and GQE for molecular ground states"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Pure Python: every dependency ships wheels for x86_64 and arm64 (Linux, macOS).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyscf>=2.4",
]

[project.optional-dependencies]
gqe = ["torch>=2.2"]
test = ["pytest>=7"]
crosscheck = ["openfermion>=1.6"]  # tests/test_openfermion.py (skipped if absent)
mpi = ["mpi4py>=3.1"]               # multi-node stress runs (needs a system MPI)
stress = ["threadpoolctl>=3"]       # reports BLAS thread counts

[tool.setuptools.packages.find]
include = ["qcore*", "VQE*", "GQE*", "stress*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer end-to-end runs (deselect with -m 'not slow')"]
