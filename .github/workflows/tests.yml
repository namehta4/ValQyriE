name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    arch: x86_64, python: "3.10"}
          - {os: ubuntu-latest,    arch: x86_64, python: "3.12"}
          - {os: ubuntu-24.04-arm, arch: arm64,  python: "3.12"}
          - {os: macos-15-intel,   arch: x86_64, python: "3.12"}
          - {os: macos-latest,     arch: arm64,  python: "3.12"}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.arch }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          pip install -e ".[test]"
      - run: python -c "import platform; print(platform.machine(), platform.python_version())"
      - run: pytest -q -m "not slow"
